[mod]
id = "portage_simple_durability_tooltip"
version = "0.1.1"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "tooltip"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip"
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]
